<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>우리반 자리·점심</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <h1>우리반 자리·점심</h1>
      <p>오늘 자리표와 메뉴를 확인하고 오전 11시 전까지 식사 층을 선택하세요.</p>
    </div>
    <a class="primary" href="admin.html">관리자</a>
  </div>
</header>

<main>
  <div id="status" class="status">불러오는 중입니다.</div>

  <div class="tabs">
    <button id="seatTab" class="primary" type="button">자리표</button>
    <button id="mealTab" type="button">오늘 점심</button>
  </div>

  <section id="seat" class="panel active">
    <div class="card">
      <h2>현재 자리표</h2>
      <p class="muted">적용일: <span id="seatDate">-</span></p>

      <div class="classroom">
        <div class="side left" id="leftSeats"></div>
        <div class="corridor">복도</div>
        <div class="side right" id="rightSeats"></div>
      </div>
    </div>
  </section>

  <section id="meal" class="panel">
    <div class="grid">
      <div class="card">
        <h2>오늘 메뉴</h2>
        <div id="menus" class="menu-grid">
          <p class="muted">메뉴를 불러오는 중입니다.</p>
        </div>

        <hr>

        <h2>식사 층 선택</h2>
        <p class="muted">
          모든 활성 학생은 처음부터 20층으로 자동 배정됩니다.
          10층에서 먹는 학생만 오전 11시 전까지 10층으로 변경하세요.
        </p>

        <label for="studentName">이름</label>
        <input
          id="studentName"
          type="text"
          maxlength="20"
          autocomplete="name"
          placeholder="이름을 입력하세요"
        >

        <div class="floor-default-box">
          <strong>기본 식사 장소: 20층</strong>
          <p>
            20층에서 먹는 경우에는 아무것도 하지 않아도 됩니다.
            10층에서 먹는 날만 아래 버튼으로 변경하세요.
          </p>
        </div>

        <div class="actions floor-actions" style="margin-top:12px">
          <button id="select10Floor" class="primary" type="button">10층으로 변경</button>
          <button id="reset20Floor" type="button">선택 취소 · 20층 복귀</button>
        </div>

        <div id="choiceStatus" class="status">
          현재 기본 상태는 20층입니다.
        </div>
      </div>

      <div class="card">
        <h2>20층 식사 조</h2>
        <div id="groups" class="groups"></div>
        <p id="deadline" class="muted"></p>
      </div>
    </div>
  </section>
</main>

<script src="common.js"></script>
<script>
const sb=supabase.createClient(
  APP_CONFIG.SUPABASE_URL,
  APP_CONFIG.SUPABASE_ANON_KEY
);

const statusBox=document.getElementById("status");
const menusBox=document.getElementById("menus");
const groupsBox=document.getElementById("groups");
const seatDateBox=document.getElementById("seatDate");
const deadlineBox=document.getElementById("deadline");
const studentNameInput=document.getElementById("studentName");
const choiceStatusBox=document.getElementById("choiceStatus");
const select10FloorButton=document.getElementById("select10Floor");
const reset20FloorButton=document.getElementById("reset20Floor");
let activeStudentNames=[];


async function loadActiveStudents(){
  const {data,error}=await sb
    .from("students")
    .select("name")
    .eq("is_active",true)
    .order("name");

  if(error) throw error;

  activeStudentNames=(data || []).map(student=>student.name);
  STUDENTS=[...activeStudentNames];
}

function showPanel(id){
  document.querySelectorAll(".panel").forEach(panel=>panel.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.getElementById("seatTab").classList.toggle("primary",id==="seat");
  document.getElementById("mealTab").classList.toggle("primary",id==="meal");

  if(id==="meal"){
    loadMealData(true);
  }
}

document.getElementById("seatTab").addEventListener("click",()=>showPanel("seat"));
document.getElementById("mealTab").addEventListener("click",()=>showPanel("meal"));

function renderMenus(menu){
  const sourceUrl=
    menu?.menu_20_source_url ||
    `https://welplan.pmh.codes/takein/${compactDate()}/all?restaurant=REST000133`;

  const items=Array.isArray(menu?.menu_20_items)
    ? menu.menu_20_items
    : [];

  const menuCards=items.length
    ? items.map(item=>`
        <article class="menu-item-card">
          ${item.imageUrl
            ? `<img class="menu-image" src="${escapeHtml(item.imageUrl)}"
                 alt="${escapeHtml(item.title)}"
                 loading="lazy"
                 referrerpolicy="no-referrer">`
            : `<div class="menu-image-placeholder">사진 없음</div>`
          }
          <div class="menu-item-body">
            <b>${escapeHtml(item.title)}</b>
            <p>${escapeHtml((item.sides || []).join(" · "))}</p>
          </div>
        </article>
      `).join("")
    : `<p class="menu-text">${escapeHtml(menu?.menu_20 || "메뉴를 불러오지 못했습니다.")}</p>`;

  menusBox.innerHTML=`
    <div class="box">
      <b>10층</b>
      <p class="menu-text">${escapeHtml(menu?.menu_10 || "등록 전")}</p>
    </div>

    <div class="box">
      <b>20층</b>
      <div class="menu-items">${menuCards}</div>
      <p class="muted menu-source">
        <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">
          Welplan 원본 메뉴 보기
        </a>
      </p>
    </div>
  `;
}
async function requestWelplanMenu(){
  const response=await fetch(
    `/api/fetch-welplan-menu?date=${compactDate()}`,
    { cache:"no-store" }
  );

  let body=null;
  try{
    body=await response.json();
  }catch{
    // JSON이 아닌 응답은 아래 오류로 처리
  }

  if(!response.ok || body?.ok===false){
    throw new Error(
      body?.message ||
      `메뉴 자동 수집 실패: HTTP ${response.status}`
    );
  }

  return body;
}

async function fetchTodayMenuFromDatabase(){
  const {data,error}=await sb
    .from("daily_menus")
    .select("*")
    .eq("menu_date",today())
    .maybeSingle();

  if(error) throw error;
  return data;
}

async function loadMealData(tryAutoFetch=false){
  menusBox.innerHTML='<p class="muted">오늘 메뉴를 불러오는 중입니다.</p>';

  try{
    let menu=await fetchTodayMenuFromDatabase();

    /*
      Supabase에 오늘 20층 메뉴가 없으면 Netlify Function을 즉시 호출합니다.
      따라서 정기 수집 시간이 지나지 않았거나 예약 함수가 실패했어도
      학생이 "오늘 점심" 창에 들어오면 한 번 더 수집을 시도합니다.
    */
    if(tryAutoFetch && !menu?.menu_20){
      menusBox.innerHTML=`
        <p class="muted inline-loading">
          Welplan에서 오늘 20층 메뉴를 가져오는 중입니다.
        </p>
      `;

      try{
        await requestWelplanMenu();
        menu=await fetchTodayMenuFromDatabase();
      }catch(fetchError){
        console.error(fetchError);

        if(menu){
          menu.menu_20_fetch_error=fetchError.message;
        }
      }
    }

    renderMenus(menu);

    if(menu?.menu_20_fetch_error && !menu?.menu_20){
      menusBox.insertAdjacentHTML(
        "beforeend",
        `<div class="status warn" style="grid-column:1/-1">
          자동 수집 오류: ${escapeHtml(menu.menu_20_fetch_error)}
        </div>`
      );
    }
  }catch(error){
    console.error(error);
    renderMenus(null);
    menusBox.insertAdjacentHTML(
      "beforeend",
      `<div class="status warn" style="grid-column:1/-1">
        메뉴 DB 조회 오류: ${escapeHtml(error.message)}
      </div>`
    );
  }

  const {data:groups,error:groupsError}=await sb
    .from("meal_groups")
    .select("*")
    .eq("group_date",today())
    .order("group_no");

  if(groupsError){
    groupsBox.innerHTML=`<div class="status warn">${escapeHtml(groupsError.message)}</div>`;
  }else{
    groupsBox.innerHTML=groups?.length
      ? groups.map(group=>`
          <div class="box meal-group-card">
            <b>${group.group_no}조</b>
            <div class="group-members">
              ${(group.members || []).map(member=>`
                <div class="group-member">${escapeHtml(member)}</div>
              `).join("")}
            </div>
          </div>
        `).join("")
      : '<p class="muted">아직 조가 공개되지 않았습니다.</p>';
  }

  const isOpen=kstHour()<11;
  select10FloorButton.disabled=!isOpen;
  reset20FloorButton.disabled=!isOpen;
  deadlineBox.textContent=isOpen
    ? "오전 11시까지 선택 또는 변경할 수 있습니다."
    : "선택이 마감되었습니다.";
}

async function loadPage(){
  renderSeats({});

  try{
    await loadActiveStudents();

    const {data,error}=await sb.rpc("get_active_seating");

    if(error) throw error;

    if(data?.length){
      renderSeats(data[0].assignment || {});
      seatDateBox.textContent=data[0].effective_date;
    }

    await loadMealData(false);

    statusBox.className="status ok";
    statusBox.textContent="최신 정보를 불러왔습니다.";
  }catch(error){
    console.error(error);
    statusBox.className="status warn";
    statusBox.textContent=`데이터를 불러오지 못했습니다: ${error.message}`;
  }
}

function validatedStudentName(){
  const inputName=studentNameInput.value.trim();

  if(!inputName){
    choiceStatusBox.className="status warn";
    choiceStatusBox.textContent="이름을 입력하세요.";
    studentNameInput.focus();
    return null;
  }

  if(!activeStudentNames.includes(inputName)){
    choiceStatusBox.className="status warn";
    choiceStatusBox.textContent="등록된 학생 이름이 아닙니다. 이름을 정확히 입력하세요.";
    studentNameInput.focus();
    return null;
  }

  return inputName;
}

select10FloorButton.addEventListener("click",async()=>{
  const inputName=validatedStudentName();
  if(!inputName) return;

  const {error}=await sb.rpc("submit_meal_choice",{
    p_student_name:inputName,
    p_floor:10
  });

  choiceStatusBox.className=error ? "status warn" : "status ok";
  choiceStatusBox.textContent=error
    ? error.message
    : `${inputName}: 오늘은 10층으로 변경했습니다.`;
});

reset20FloorButton.addEventListener("click",async()=>{
  const inputName=validatedStudentName();
  if(!inputName) return;

  const {error}=await sb.rpc("cancel_meal_choice",{
    p_student_name:inputName
  });

  choiceStatusBox.className=error ? "status warn" : "status ok";
  choiceStatusBox.textContent=error
    ? error.message
    : `${inputName}: 선택을 취소하고 기본 20층으로 복귀했습니다.`;
});

loadPage();
setInterval(loadPage,60000);
</script>
</body>
</html>
