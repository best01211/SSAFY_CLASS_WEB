<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<header><div class="wrap top"><div><h1>관리자</h1><p>자리 적용 날짜와 당일 메뉴를 관리합니다.</p></div><a class="primary" href="index.html">학생 화면</a></div></header><main>
<section id="login" class="card login"><h2>로그인</h2><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="pw" type="password"><div class="actions" style="margin-top:12px"><button id="loginBtn" class="primary">로그인</button></div><div id="loginStatus" class="status">관리자 로그인이 필요합니다.</div></section>
<section id="app" style="display:none"><div class="tabs"><button class="primary" onclick="showAdmin('seatAdmin')">자리 예약</button><button onclick="showAdmin('menuAdmin')">메뉴 등록</button></div>
<div id="seatAdmin" class="panel active"><div class="grid"><div class="card"><h2>자리 배치 예약</h2><label>적용 날짜</label><input id="effectiveDate" type="date"><div class="actions" style="margin-top:12px"><button id="generate" class="primary">자리 생성</button><button id="schedule" class="success" disabled>해당 날짜로 예약</button></div><div id="seatStatus" class="status">날짜를 정하고 생성하세요.</div><div class="classroom"><div class="side left" id="leftSeats"></div><div class="screen">스크린<br><br>선생님<br>사랑합니다</div><div class="side right" id="rightSeats"></div></div></div><div class="card"><h2>예약 목록</h2><div id="scheduleList"></div></div></div></div>
<div id="menuAdmin" class="panel"><div class="grid"><div class="card"><h2>메뉴 등록</h2><label>날짜</label><input id="menuDate" type="date"><label>10층 메뉴</label><textarea id="menu10"></textarea><label>20층 메뉴</label><textarea id="menu20"></textarea><div class="actions"><button id="saveMenu" class="primary">메뉴 저장</button></div><div id="menuStatus" class="status">메뉴를 입력하세요.</div></div><div class="card"><h2>선택 현황</h2><div id="choiceList" class="muted">조회 전</div><div class="actions"><button id="refresh">새로고침</button><button id="manual" class="success">20층 조 수동 생성</button></div><p class="muted">평일 오전 11시에 자동 생성됩니다.</p></div></div></div></section></main>
<script src="common.js"></script><script>
const sb=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);let rounds=[],candidate=null;
function showAdmin(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function key(a,b){return[a,b].sort().join('|')}function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function evaluate(a){const seen=new Set();rounds.forEach(r=>ROWS.forEach(row=>{const n=row.map(s=>r.assignment?.[s]).filter(Boolean);for(let i=0;i<n.length;i++)for(let j=i+1;j<n.length;j++)seen.add(key(n[i],n[j]))}));let score=0,rep=0;ROWS.forEach(row=>{const n=row.map(s=>a[s]).filter(Boolean);for(let i=0;i<n.length;i++)for(let j=i+1;j<n.length;j++)if(seen.has(key(n[i],n[j]))){score+=100000;rep++}});return{score,rep}}
generate.onclick=()=>{let best,ev={score:Infinity,rep:0};for(let t=0;t<40000;t++){const names=sh([...STUDENTS,null]),seats=sh(SEATS),a={};seats.forEach((s,i)=>{if(names[i])a[s]=names[i]});const e=evaluate(a);if(e.score<ev.score){best=a;ev=e;if(e.score===0)break}}candidate=best;renderSeats(best);schedule.disabled=false;seatStatus.className=ev.rep?'status warn':'status ok';seatStatus.textContent=ev.rep?`과거 같은 줄 중복 ${ev.rep}건 포함`:'과거 같은 줄 조합 없이 생성'};
async function load(){const {data}=await sb.from('seating_schedules').select('*').order('effective_date');rounds=data||[];scheduleList.innerHTML=rounds.map(x=>`<div class="status"><b>${x.effective_date}</b></div>`).join('')||'예약 없음'}
schedule.onclick=async()=>{if(!effectiveDate.value||!candidate)return alert('날짜와 자리표를 확인하세요.');const {error}=await sb.from('seating_schedules').upsert({effective_date:effectiveDate.value,assignment:candidate},{onConflict:'effective_date'});if(error)return alert(error.message);schedule.disabled=true;await load();seatStatus.className='status ok';seatStatus.textContent='예약했습니다.'}
saveMenu.onclick=async()=>{const {error}=await sb.from('daily_menus').upsert({menu_date:menuDate.value,menu_10:menu10.value,menu_20:menu20.value},{onConflict:'menu_date'});menuStatus.className=error?'status warn':'status ok';menuStatus.textContent=error?error.message:'저장했습니다.'}
async function choices(){const {data,error}=await sb.from('meal_choices').select('*').eq('choice_date',menuDate.value||today()).order('floor').order('student_name');choiceList.innerHTML=error?error.message:(data||[]).map(x=>`${x.student_name} · ${x.floor}층`).join('<br>')||'선택 없음'}
refresh.onclick=choices;manual.onclick=async()=>{const {error}=await sb.rpc('generate_today_meal_groups');alert(error?error.message:'생성했습니다.')};
loginBtn.onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:pw.value});if(error){loginStatus.className='status warn';loginStatus.textContent=error.message}else init()};
async function init(){const {data:{session}}=await sb.auth.getSession();login.style.display=session?'none':'block';app.style.display=session?'block':'none';if(session){effectiveDate.value=today();menuDate.value=today();renderSeats({});await load();await choices()}}
init();
</script></body></html>
